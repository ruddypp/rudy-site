<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' https://fonts.gstatic.com https://www.googletagmanager.com;">
    <meta name="author" content="Rudy Paningal" />
    <meta name="theme-color" content="#B98EFC" />

    <!-- The hero poster is the LCP element: a still frame that paints with the
         HTML, so the largest paint no longer waits on the animation chain.
         The animation itself is fetched in parallel and fades in over it. -->
    <link rel="preload" as="image" href="/images/hero-poster.webp" fetchpriority="high" />
    <link rel="preload" as="fetch" href="/lottie/hero.json" crossorigin />

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
